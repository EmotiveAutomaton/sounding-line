# The bounded hypothesis family, v2.
#
# v1 is NOT edited. It remains hash-locked and is retained so that readings taken under it stay
# comparable to each other, per docs/DEVIATIONS.md. v2 is a new file with a new hash, and a
# reading taken under one is not comparable to a reading taken under the other.
#
# ── WHAT CHANGED FROM v1, AND WHY ────────────────────────────────────────────────────────────
#
# Two calibration passes with a human curator produced one change, and the change was forced by
# the curator reaching for something the family did not have. D-1 records that a hand-written
# family encodes the author's assumptions about what people make things for, and that this is
# exactly the kind of assumption the project usually tests rather than asserts. That test ran.
#
#   CALIBRATION_01 §3 — the curator, unprompted: "I do think effort is something you're missing
#   in these," followed by a full effort ranking across the batch given without being asked.
#
#   CALIBRATION_02 §5 — and then, before the dimension was built, the same curator split it in
#   two. On two artifacts independently: "the effort that went into this specific page was
#   probably like a three... but the work that went into it was upwards of a five because it's
#   demonstrating the work of a five. So it's a most-both thing sort of."
#
# So v2 adds TWO dimensions, not one. Collapsing them would destroy the distinction between a
# postmortem and the work the postmortem describes — which is precisely where this project's
# depth construct lives.

version: 3
supersedes: 2
spec_section: "§4"
decision: "D-1 — fixed and hand-written, amended by calibration rather than by learning"
amendment: "C-4 (revised) — artifact_effort and demonstrated_work as separate dimensions"
amendment_v3: "C-23 / S1.4 — leaked and emblematic affect, the first non-instrumental dimensions"

provenance_of_changes:
  - "CALIBRATION_01 §3 — curator identified `effort` as absent from the family"
  - "CALIBRATION_02 §5 — curator split effort into artifact-effort and demonstrated-work"
  - "CALIBRATION_02 §7 — artifact_effort has a definitional recovery ceiling; see its `limit` field"
  - "READING_SESSION_01 — the curator's operative descriptions were overwhelmingly affective,
     and he named the gap himself: 'I reach for the emotional state of the author... I am
     reaching for the edges of the solution space that humans use to simplify the solution
     state, and I am reflexively doing so.'"

dimensions:

  # ── UNCHANGED FROM v1 ───────────────────────────────────────────────────────────────────────
  purpose:
    kind: categorical
    load_bearing: false
    why_in_family: "the bounded set of things people make artifacts for"
    values:
      - id: inform
        gloss: "transfer something the reader did not know, for the reader's benefit"
      - id: persuade
        gloss: "move the reader's position on something the maker holds a stake in"
      - id: sell
        gloss: "cause a transaction"
      - id: entertain
        gloss: "hold attention as the end rather than the means"
      - id: coordinate
        gloss: "get people to act in concert; schedules, protocols, instructions"
      - id: rank
        gloss: "improve the artifact's position in some retrieval or ordering system"
      - id: discharge_obligation
        gloss: "satisfy a requirement that the artifact exist; compliance, boilerplate, filing"
      - id: express
        gloss: "externalise a maker-state, with no required effect on any reader"

  audience:
    kind: categorical
    load_bearing: true
    why_in_family: >
      The grooming case is a hypothesis IN the family, not an exception to it. "Made for a
      machine to ingest rather than a person to read" is a purpose the maker HAD, rather than an
      absence of purpose.
    values:
      - id: specific_person
        gloss: "one named reader the maker could picture"
      - id: known_group
        gloss: "a bounded set the maker is a member of or adjacent to"
      - id: general_public
        gloss: "an unbounded human readership"
      - id: machine
        gloss: >
          a retrieval system, a ranking system, or a model's training corpus. A purpose the
          maker had, never an accusation about who wrote the artifact.
      - id: nobody_in_particular
        gloss: >
          no modelled reader at all. Distinct from `machine`: this is absence of an audience
          model, that is presence of a non-human one. Collapsing them would destroy the
          measurement.

  depth:
    kind: ordinal
    load_bearing: true
    why_in_family: "the V5 construct, directly — how many levels of decision are visible"
    provenance:
      - "E30 — depth moves how much of the maker's METHOD transfers, and provably cannot move how much of the PURPOSE does"
      - "N21 — depth is not effort wearing a hat, but in the simulation the dissociation was a construction commitment rather than a finding"
    levels:
      - id: 0
        gloss: "no decision recoverable above the sentence"
      - id: 1
        gloss: "local choices only — wording, ordering within a section"
      - id: 2
        gloss: "structural choices — what to include, what to cut, how to sequence"
      - id: 3
        gloss: "framing choices — what the artifact is about, against alternatives visibly rejected"
      - id: 4
        gloss: "stance choices — why this artifact rather than none, against a visible cost of making it"
    falsifier:
      hazard: "depth is just length"
      control: "length must be regressed out before any depth claim is reported"

  cost_borne:
    kind: ordinal
    load_bearing: false
    why_in_family: "the metabolic commitment that makes intent legible at all"
    gloss: "what the maker spent that they did not have to"
    distinct_from_effort: >
      Cost is what was GIVEN UP. Effort is how hard they WORKED. A child labouring over a bad
      page spends effort and bears no cost; a professional who publishes one careful sentence
      that can be held against them bears cost with little effort. v1 collapsed these and the
      curator's data separated them.
    levels:
      - id: 0
        gloss: "nothing beyond production — no evidence of anything given up"
      - id: 1
        gloss: "time or care visible in execution"
      - id: 2
        gloss: "specific knowledge that had to be acquired for this artifact"
      - id: 3
        gloss: "risk borne — a position taken that costs the maker something if wrong"

  # ── NEW IN v2 ───────────────────────────────────────────────────────────────────────────────
  artifact_effort:
    kind: ordinal
    load_bearing: false
    new_in: 2
    why_in_family: >
      How hard the maker worked on THIS OBJECT. Not how good it is, and not what it cost them.
      Added because the curator reached for it unprompted across two passes.
    gloss: "work spent producing the artifact itself"
    limit: >
      PARTIALLY RECOVERABLE BY CONSTRUCTION, and this is recorded so a later null is read as a
      definitional ceiling rather than an instrument failure. CALIBRATION_02 §7: on one artifact
      the curator could not score it at all — "if they vibe coded it, maybe like a three... but
      if they made it themselves more like a five." The missing information is HOW IT WAS MADE,
      which is exactly what this instrument refuses to claim (SPEC §1). Expect a lower recovery
      ceiling here than for depth.
    levels:
      - id: 0
        gloss: "assembled or templated; no work visible beyond assembly"
      - id: 1
        gloss: "a single pass, unrevised"
      - id: 2
        gloss: "researched or checked, but not laboured over"
      - id: 3
        gloss: "visibly revised; structure and wording show second thoughts"
      - id: 4
        gloss: "sustained work over time; the artifact carries traces of its own construction"
      - id: 5
        gloss: "exhaustive — the making of the artifact was itself a project"

  demonstrated_work:
    kind: ordinal
    load_bearing: true
    new_in: 2
    why_in_family: >
      How much work the artifact REPORTS ON, as distinct from how much went into writing it.
      A postmortem is a cheap document about an expensive thing. CALIBRATION_02 §5: two
      artifacts scored 3 for the page and 5 for the work behind it, independently, by the same
      reader on the same criterion.
    gloss: "work spent on whatever the artifact is an account of"
    load_bearing_because: >
      This is where the depth construct actually attaches for reportage. An artifact whose
      demonstrated_work greatly exceeds its artifact_effort is a report on real activity; one
      where they are equal and low is a report on nothing. Collapsing the two into a single
      `effort` score cannot express either case.
    hypothesis:
      claim: "high demonstrated_work motivates artifact production"
      source: >
        Curator, CALIBRATION_02 §5: "the fact that the work was a five is probably why they made
        it in the first place. You kind of want to share the effort."
      status: "recorded as C-8, untested. If true the two dimensions are not independent."
    levels:
      - id: 0
        gloss: "the artifact reports on nothing outside itself"
      - id: 1
        gloss: "reports on something small, or on someone else's work"
      - id: 2
        gloss: "reports on real activity of ordinary scale"
      - id: 3
        gloss: "reports on sustained work — a project, a build, an investigation"
      - id: 4
        gloss: "reports on work of substantial scale or duration"
      - id: 5
        gloss: "the artifact is an account of a major undertaking"

  # ---------------------------------------------------------------------------------------------
  # NEW IN v3 -- TWO LAYERS, NOT ONE.
  #
  # This is the curator's correction to my first draft, and it is the whole structure of the
  # dimension:
  #
  #     The whole dimension is not necessarily performed and not felt. It's actually kind of both.
  #     There is a layer that is TRUE, and I would call that like emotional LEAKAGE that can show
  #     up in your text and that can be very real... Then there's a second layer, I think Ekman
  #     would call it the EMBLEMATIC layer, which is a conscious social decision. And so it's both
  #     performed and felt, and they can be independent, though generally aren't -- I'd say they
  #     correlate probably. If you have something felt, you kind of want to perform it. It's hard
  #     not to.
  #
  # So: two distributions over one value set, and THE GAP BETWEEN THEM IS ITSELF A MEASUREMENT.
  # Emblematic without leaked is pure performance. Leaked without emblematic is concealment, which
  # is where the curator's own session-01 reading lived -- "low-level anger, but performative in
  # nature. It's not real, but it was real at some point. At this point they're kind of half
  # recreating it."
  #
  # A single performed-not-felt dimension could not represent that sentence, and that sentence is
  # the observation the dimension exists to capture.
  # ---------------------------------------------------------------------------------------------

  leaked_affect:
    kind: categorical
    load_bearing: true
    new_in: 3
    layer: "involuntary -- what got through"
    why_in_family: >
      The true layer. Affect that reaches the text without being chosen: a run-on where the maker
      got going, a word sharper than the argument needs, a caveat that protests more than the
      claim warrants. Ekman's leakage, in a medium where the leak is lexical and structural rather
      than facial.
    values: &affect_values
      - id: none_recoverable
        gloss: >
          no affective stance can be recovered from this artifact. NOT a claim that none was
          present. The curator chose this framing over `none_legible` and the reasoning is
          decisive: "humans are excellent at concealing motives... I don't think humans do
          anything unless there's a reason. Really." Concealment through a louder emblematic
          display, through precise control, or through many layers of editing all produce this
          reading, and none of them means absence. Listed first so it is never the residual:
          the wall has to be something the instrument can SAY.
      - id: seeking
        gloss: >
          curiosity, enthusiasm, the pleasure of working a problem; and the drive toward standing
          and competence in a community. Panksepp's SEEKING is appetitive, not merely pleasant.
      - id: rage
        gloss: "irritation, frustration, grievance"
      - id: fear
        gloss: >
          anxiety about exposure or standing -- hedging, credentialing, pre-empting the objection.
          SEE THE LITERATURE HAZARD BELOW: this may be conflating Panksepp's FEAR with
          PANIC/GRIEF's separation distress, and the two have different behavioural signatures.
      - id: care
        gloss: >
          wanting the reader to succeed, and spending on it. NARROWER THAN IT LOOKS, per the
          curator's correction: a competent professional register is usually seeking plus grief,
          not care. Care is when they wanted to HELP.
      - id: play
        gloss: "humour, wordplay, delight in the form"
      - id: lust
        gloss: >
          desire as a driver of the work. Restored after I wrongly dropped it -- see the note
          below. Signature, in the curator's words rather than mine: not justification for an
          unasked question, but THE THING A READER POLITELY GLOSSES OVER. "Someone ends up
          talking about feet for a sentence too long and you're like, ooh, buddy." Attention
          dwelling past what the argument needs. Never emblematic in practice, which makes it
          the family's purest single-layer value.
      - id: grief
        gloss: >
          loss, nostalgia, resignation -- and separation distress: not wanting to be isolated,
          wanting to be well regarded and established. Panksepp's PANIC/GRIEF is the social-bond
          system, not only bereavement.

  emblematic_affect:
    kind: categorical
    load_bearing: true
    new_in: 3
    layer: "chosen -- what was displayed"
    why_in_family: >
      The performed layer. Ekman's emblematic display: a conscious social decision about which
      stance to present. This is the layer that is a DECISION, and therefore the layer the rest of
      this instrument already knows how to handle -- it has an alternative that was rejected, it
      can be pointed at, and the maker can rebut it.
    values: *affect_values

  # ---------------------------------------------------------------------------------------------
  # A NAMED SIMPLIFICATION: THE TWO LAYERS SHARE ONE VALUE SET
  #
  # They are made identical by YAML anchor, which is convenient and is not obviously right. The
  # second research round found that the leaked/emblematic split maps onto the field's central
  # unresolved debate -- Panksepp's primary process against Barrett's constructed emotion -- and
  # Barrett's whole claim is that constructed categories are CULTURALLY VARIABLE while core affect
  # is not. If that holds, the two layers should not have the same vocabulary.
  #
  # Kept shared anyway, for now, because a divergence measured over mismatched supports is not a
  # divergence, and divergence is the quantity the two layers exist to produce. Recorded as a
  # simplification with a name rather than left as an unexamined default.
  # ---------------------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------------------------
  # WHY LUST IS IN THE SET, HAVING BEEN WRONGLY REMOVED
  #
  # I dropped it on the grounds that the probe could only confabulate it. Overruled, and the
  # reasoning is better than mine:
  #
  #     It just seems incorrect. There's no reason to do so, and it does show up... someone in one
  #     of the builds for Elden Ring might talk about how they prefer playing scantily clad women
  #     characters. They might justify it by saying it helps field of view, but that's a lust
  #     statement... It's not necessarily confabulatable. People take actions in accordance with
  #     lust and it is identifiable. It's more actively CONCEALED, and is often one of the more
  #     hard to disentangle things. I've heard people say that all art is made for sex reasons,
  #     and I think this is the source of that. It would be disingenuous to have it removed.
  #
  # It is also the family's clearest case of the two layers coming apart: a lust-driven decision is
  # routinely leaked and almost never emblematic. Removing it would have removed the dimension's
  # best worked example.
  # ---------------------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------------------------
  # THE FLAT-MOTIVE CASE GETS NO VALUE, DELIBERATELY
  #
  #     I don't think flat motive needs its own value. I'm kind of hoping that it emerges from the
  #     data organically... Flat motive should only be AI, because practically speaking nearly all
  #     of what you would expect human behaviour to do would be driven by some kind of drive or
  #     another. Be that simple fear if you're a corporate stooge who must do XYZ, or grief in the
  #     case of someone who wants their business to be well regarded -- also fear in that second
  #     one, and seeking. Those three are going to link together pretty frequently.
  #
  # Recorded as a HAZARD rather than built: if `none_legible` fires only on machine content, it is
  # a provenance claim wearing an affect label, and SPEC 1 forbids the instrument from making one.
  # FAMILY_V3_REVIEW.md Q3 is open on exactly this.
  # ---------------------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------------------------
  # THE LITERATURE HAZARD, RECORDED BECAUSE IT IS NOT YET DISCHARGED
  #
  #     You're going to have to do a pretty decent literature review if you want to align these to
  #     specific behaviours, because I'd imagine this has been done at length. I'm wondering
  #     whether this is fertile ground for research even.
  #
  # The glosses above are the curator's readings mapped onto Panksepp's names BY THE AUTHOR. There
  # is no published mapping from primary-process affective systems to TEXTUAL signatures behind
  # them. Until that review exists the names are provisional, and the boundary between `fear` and
  # `grief` is the least safe thing in this file.
  # ---------------------------------------------------------------------------------------------

  trade_offs:
    kind: structured
    load_bearing: true
    why_in_family: >
      Values are not visible in what someone said they wanted. They are visible in WHAT THEY
      GAVE UP. The Zahavian-to-trade-off correction (E51), applied as a measurement.
    decision: "D-3 — trade-offs only in v1 and v2"
    schema:
      gained: "what the artifact achieves that a cheaper version would not"
      given_up: "what a different choice would have achieved, and was not taken"
      may_not_claim: >
        No named value may be asserted. The output is the trade-off pair. Any rendering of that
        pair as a value statement belongs to the reader, not the instrument.

# ---------------------------------------------------------------------------------------------
# Known limits of v2, recorded rather than fixed.
#
# Each is a real thing the curator observed that this family still cannot express. They are here
# so that a future v3 has a written starting point, and so that nobody mistakes silence for
# adequacy.
known_limits:
  - id: L-1
    limit: "audience is one distribution over the whole artifact"
    observed: >
      CALIBRATION_01 §6 — "They were writing it to someone, but at a certain point they were
      talking to everyone." The audience CHANGED mid-artifact and the family cannot say so.
  - id: L-2
    limit: "register is assumed uniform across an artifact"
    observed: >
      CALIBRATION_02 §6 — two professional-media artifacts independently showed corporate
      register at the opening decaying across the piece, with the maker visible in the back
      half. Suppressed intent leaks progressively. Recorded as a Gate 2 hypothesis (C-9);
      it also confounds convergence measured across chunks.
  - id: L-3
    limit: "decisions are assumed to live inside the artifact being read"
    observed: >
      Curator, after batch 2 — a reading changed on seeing an identically formatted sibling
      guide, which revealed the FORMAT as a carefully constructed prior decision reused. A
      template is compressed prior intent: the decision was made once, earlier, elsewhere, and
      amortised across many artifacts. The instrument reads one artifact at a time and cannot
      see this. Directly related to E43 — practice compresses decisions, and compression makes
      them unavailable for report. See C-13.
  - id: L-4
    limit: "no representation of the reader's relationship to the artifact"
    observed: >
      CALIBRATION_01 §5 — engagement tracked whether method was available to take on board, and
      item 4 produced REPULSION rather than indifference: the gate slamming on method judged
      worse than the reader's own. Indifference, blocked-by-expertise, and repulsion are three
      distinct states and the family represents none of them.


affect_null_3_layer_separation: >
  N-AFF-3. `leaked` and `emblematic` must not come back as the SAME distribution. If mean
  divergence across a corpus is near zero, the probe is answering one question twice and the
  two-layer model is unsupported by this instrument, whatever is true of people.
  And the collapse direction is predicted in advance (docs/theory/AFFECT_ARCHITECTURE.md 1):
  `leaked` should separate WORSE than `emblematic`, because language encodes the tertiary
  constructed layer -- that is what words ARE -- while the primary layer reaches text only through
  leakage. One layer separating and the other not is the expected result, not a design failure.

affect_null_2_discriminant: >
  N-AFF-2. Across a corpus, the eight values must not COLLAPSE. Pairwise correlation of value
  weights across artifacts stays below 0.6 for at least two-thirds of pairs, or the dimension is
  reporting one number under eight names.
  Added after the literature review (docs/theory/AFFECT_LITERATURE.md) and modelled directly on a
  documented failure: LIWC marker-word scores for McClelland motives inter-correlated up to 0.49
  and could not keep three motives apart. Stage E is an unsupervised prompt, which is that class
  of instrument rather than the supervised-transformer class that reaches r = 0.85. N-AFF checks
  flatness where there is no maker; a probe whose eight values are really two would pass it.

affect_null_required: >
  N-AFF. On artifacts with no reconstructible maker BOTH distributions must stay flat --
  normalised entropy above 0.85. E36's null N28 applied to a new dimension, written before the
  dimension exists rather than discovered after a result. An affective label is exactly what a
  language model supplies fluently whether or not anything supports it, so if N-AFF fails both
  layers are measuring the model's fluency and every number using them is uninterpretable.

affect_divergence: >
  The quantity the two layers exist to produce. Total variation distance between leaked and
  emblematic. Low divergence is the ordinary case -- "if you have something felt, you kind of
  want to perform it." High divergence is either concealment (leaked without emblematic) or pure
  performance (emblematic without leaked), and those are different findings that one distribution
  cannot tell apart.

affect_evidence_rule: >
  Every value above 10 points in EITHER layer requires a located quote, on the same terms as
  `alternative_rejected`. An affect that cannot be pointed at was supplied by the reader.

# ---------------------------------------------------------------------------------------------
may_not_claim:
  - "that a machine wrote this. The instrument never makes a claim about authorship."
  - >
    that low depth means low value. It means few decisions are RECOVERABLE, which is a claim
    about the artifact and the reader jointly, and which the maker can rebut with evidence.
  - >
    that a machine-audience posterior is an accusation. It is a hypothesis in the family with a
    probability attached, reported alongside the other quantities.
  - >
    any of the output quantities alone. The reading is the tuple. Report all of them always —
    the simulation's whole methodology is that a single number invites the overclaim.
  - >
    that `leaked_affect` is what the maker felt. It is what got through into the text, which is
    evidence about a state and not the state itself. The maker may rebut it, and that is the
    property keeping this inside an instrument rather than inside a personality test.
  - >
    that a flat affective posterior means a machine wrote this. If `none_legible` turns out to
    fire only on machine content, that is a PROVENANCE claim wearing an affect label, and the spec
    forbids the instrument from making one. An open hazard, not a feature.
  - >
    that the Panksepp value names are validated. They are one reader's readings mapped onto
    Panksepp's names by the author, with no published mapping from primary-process systems to
    TEXTUAL signatures behind them. Provisional until that review exists.
  - >
    that performed_affect is what the maker FELT. It is what the artifact performs, and a
    performance is a decision. The maker may rebut it with evidence, which is the property
    that keeps this dimension inside the instrument rather than inside a personality test.
  - >
    that artifact_effort is fully recoverable from text. It is not, by construction, because the
    missing information is how the artifact was made.
